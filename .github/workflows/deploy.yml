name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - name: Prepare deployment
        run: |
          mkdir -p staging/beta
          cp dist/index.html staging/beta/index.html
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Promote: production = fresh build
            cp dist/index.html staging/index.html
          else
            # Auto-deploy: keep current production, update beta only
            curl -fsSL https://wimyedema.github.io/skatting/index.html -o staging/index.html \
              || cp dist/index.html staging/index.html
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: staging

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
